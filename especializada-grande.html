<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producción Especializada de Leche Bovina (Grandes Productores)</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
        }

        .banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 20px;
            border-bottom: 1px solid #dfe5e8;
            background: #f8faf9;
        }

        .banner-title {
            margin: 0;
            color: #071322;
            font-size: 16px;
            font-weight: 700;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            background: #2f8438;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }

        .back-link:hover,
        .back-link:focus-visible {
            background: #246b2d;
            outline: none;
        }

        iframe {
            flex: 1;
            width: 100%;
            border: 0;
            background: #ffffff;
        }

        @media (max-width: 640px) {
            .banner {
                flex-direction: column;
                align-items: stretch;
            }

            .back-link {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="banner">
        <p class="banner-title">Producción Especializada de Leche Bovina (Grandes Productores)</p>
        <a class="back-link" href="index.html">← Volver al inicio</a>
    </header>
    <iframe
        title="Formulario Producción Especializada de Leche Bovina (Grandes Productores)"

    </iframe>
</body>
</html>
